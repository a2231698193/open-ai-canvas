services:
  migrate:
    image: open-ai-canvas-backend:server
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: &backend_build_args
        GO_IMAGE: ${GO_IMAGE:-docker.m.daocloud.io/library/golang:1.25-alpine}
        ALPINE_IMAGE: ${ALPINE_IMAGE:-docker.m.daocloud.io/library/alpine:3.22}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://mirrors.aliyun.com/alpine}
        BUILD_GOMAXPROCS: ${BUILD_GOMAXPROCS:-}
        BUILD_GOGC: ${BUILD_GOGC:-}

  backend:
    image: open-ai-canvas-backend:server
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: *backend_build_args

  web:
    image: open-ai-canvas-web:server
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUN_IMAGE: ${BUN_IMAGE:-docker.m.daocloud.io/oven/bun:1.3.13}
        NGINX_IMAGE: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.27-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        VITE_TLDRAW_LICENSE_KEY: ${VITE_TLDRAW_LICENSE_KEY:-}
